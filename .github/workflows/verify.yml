name: Verify preview
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run cli:verify
      - run: npm run mcp:verify
      - run: npm run docs:build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: videoagentvault-cli-${{ github.sha }}
          path: .release/cli/*
          if-no-files-found: error
          retention-days: 30
  processor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build the processor image
        run: docker build -t videoagentvault-processor processor
      - name: Test synthetic media without network access
        run: >-
          docker run --rm --network none --entrypoint python
          -e PROCESSOR_MODULE=/app/server.py
          -v "$PWD/tests:/tests:ro" videoagentvault-processor
          -m unittest discover -s /tests -p 'test_*.py' -v
